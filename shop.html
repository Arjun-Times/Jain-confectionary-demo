<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop | Jain Confectionery, Pilibhit</title>
<meta name="description" content="Order chocolates, cakes, ice cream, biscuits, namkeen and cold drinks online from Jain Confectionery, Pilibhit.">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='29' fill='%23fff' stroke='%23B08D3E' stroke-width='3'/><text x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-size='34' fill='%238A6A25'>J</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Instrument+Sans:wght@400..700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="shop">
<main>
  <div class="wrap shop-head">
    <h1>The shop</h1>
  </div>
  <div class="shop-top">
    <div class="wrap">
      <label class="search" for="search">
        <span data-icon="search"></span>
        <span class="sr-only">Search products</span>
        <input id="search" type="search" placeholder="Search chocolates, cake, chips…" autocomplete="off">
      </label>
      <div class="chips" id="chips" role="toolbar" aria-label="Filter by category"></div>
    </div>
  </div>
  <section class="wrap shop-results">
    <p class="result-note" id="result-note" aria-live="polite"></p>
    <div class="p-grid" id="grid"></div>
  </section>
</main>
<div class="cart-bar" id="cart-bar" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
