<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop | Jain Confectionery, Pilibhit</title>
<meta name="description" content="Order groceries, snacks, chocolates, drinks, personal care and household items online from Jain Confectionery, Pilibhit.">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='29' fill='%23fff' stroke='%23A9853A' stroke-width='3'/><text x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-size='34' font-weight='700' fill='%237A5C1C'>J</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..800;1,400..800&family=Manrope:wght@400..800&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="shop">
<main>
  <div class="wrap shop-head">
    <div>
      <h1>The shop</h1>
      <p><span data-product-count>45</span> products across <span data-shelf-count>8</span> shelves. Prices never above MRP.</p>
    </div>
  </div>
  <div class="shop-top">
    <div class="wrap">
      <div class="shop-bar">
        <label class="search" for="search">
          <span data-icon="search"></span>
          <span class="sr-only">Search products</span>
          <input id="search" type="search" placeholder="Search atta, soap, chips…" autocomplete="off">
        </label>
        <label class="sr-only" for="sort">Sort products</label>
        <select class="sort-select" id="sort">
          <option value="popular">Popular first</option>
          <option value="low">Price: low to high</option>
          <option value="high">Price: high to low</option>
          <option value="savings">Biggest savings</option>
        </select>
      </div>
      <div class="chips" id="chips" role="toolbar" aria-label="Filter by shelf"></div>
    </div>
  </div>
  <section class="wrap shop-results">
    <p class="result-note" id="result-note" aria-live="polite"></p>
    <div class="p-grid" id="grid"></div>
  </section>
</main>
<div class="cart-bar" id="cart-bar" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
